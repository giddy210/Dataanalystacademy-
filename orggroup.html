<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FeedConnect - Group Members</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f4f7f4;
    color:#222;
}

/* HEADER */

header{
    height:80px;
    background:#176d38;
    display:flex;
    align-items:center;
    padding:0 25px;
}

.logo{
    font-size:30px;
    font-weight:bold;
}

.feed{
    color:white;
}

.connect{
    color:#ffd43b;
}

.chicken{
    font-size:28px;
    margin-left:5px;
}


/* CONTAINER */

.container{
    max-width:850px;
    margin:35px auto;
    padding:0 20px;
}


/* TITLE */

.title{
    text-align:center;
    margin-bottom:25px;
}

.title h1{
    color:#176d38;
    font-size:32px;
}

.title p{
    color:#666;
    margin-top:8px;
}


/* GROUP CARD */

.group-card{
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
    margin-bottom:20px;
}

.group-card h2{
    color:#176d38;
    margin-bottom:15px;
}


/* STATS */

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-bottom:20px;
}

.stat{
    background:#f1f7f3;
    padding:18px;
    border-radius:10px;
    text-align:center;
}

.stat h3{
    color:#666;
    font-size:14px;
}

.stat strong{
    display:block;
    color:#176d38;
    font-size:23px;
    margin-top:8px;
}


/* PROGRESS */

.progress{
    height:18px;
    background:#ddd;
    border-radius:20px;
    overflow:hidden;
    margin:15px 0;
}

.progress-bar{
    width:64%;
    height:100%;
    background:#176d38;
}

.progress-info{
    display:flex;
    justify-content:space-between;
    color:#555;
}


/* TABLE */

.table-container{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
}

th,
td{
    padding:14px;
    border-bottom:1px solid #eee;
    text-align:left;
}

th{
    background:#176d38;
    color:white;
}

tr:hover{
    background:#f7faf7;
}


/* STATUS */

.status{
    background:#dff3e6;
    color:#176d38;
    padding:5px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}


/* BUTTON */

button{
    width:100%;
    padding:15px;
    margin-top:20px;
    border:none;
    border-radius:8px;
    background:#ffd23f;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#ffdf67;
}


/* MOBILE */

@media(max-width:600px){

    .logo{
        font-size:26px;
    }

    .container{
        margin-top:25px;
    }

    .title h1{
        font-size:27px;
    }

    .stats{
        grid-template-columns:1fr;
    }

    th,
    td{
        padding:11px;
        font-size:13px;
    }

}

</style>
</head>


<body>
