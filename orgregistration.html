<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FeedConnect - Registration</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#f4f7f4;
    color:#222;
}


/* HEADER */

header{
    height:80px;
    background:#176d38;
    display:flex;
    align-items:center;
    padding:0 25px;
}

.logo{
    font-size:30px;
    font-weight:bold;
}

.feed{
    color:white;
}

.connect{
    color:#ffd43b;
}

.chicken{
    font-size:28px;
    margin-left:5px;
}


/* CONTAINER */

.container{
    max-width:650px;
    margin:35px auto;
    padding:0 20px;
}


/* TITLE */

.title{
    text-align:center;
    margin-bottom:25px;
}

.title h1{
    color:#176d38;
    font-size:32px;
}

.title p{
    color:#666;
    margin-top:8px;
}


/* REGISTRATION CARD */

.card{
    background:white;
    padding:28px;
    border-radius:15px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}


/* FORM */

.form-group{
    margin-bottom:18px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
}

input,
select{
    width:100%;
    padding:14px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

input:focus,
select:focus{
    outline:none;
    border-color:#176d38;
}


/* TWO COLUMNS */

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}


/* CHECKBOX */

.checkbox{
    display:flex;
    align-items:flex-start;
    gap:10px;
    margin:20px 0;
    font-size:14px;
    color:#555;
}

.checkbox input{
    width:auto;
    margin-top:3px;
}


/* BUTTON */

.register-btn{
    width:100%;
    padding:16px;
    border:none;
    border-radius:8px;
    background:#ffd23f;
    color:#111;
    font-size:19px;
    font-weight:bold;
    cursor:pointer;
}

.register-btn:hover{
    background:#ffdf67;
}


/* SUCCESS */

.success{
    display:none;
    background:#e5f7eb;
    color:#176d38;
    padding:18px;
    border-radius:8px;
    margin-top:20px;
    line-height:1.6;
}


/* LOGIN */

.login{
    text-align:center;
    margin-top:20px;
    color:#666;
}

.login a{
    color:#176d38;
    font-weight:bold;
    text-decoration:none;
}


/* MOBILE */

@media(max-width:600px){

    .logo{
        font-size:26px;
    }

    .container{
        margin-top:25px;
    }

    .title h1{
        font-size:28px;
    }

    .card{
        padding:20px;
    }

    .row{
        grid-template-columns:1fr;
        gap:0;
    }

}

</style>
</head>


<body>


<!-- HEADER -->

<header>

    <div class="logo">

        <span class="feed">Feed</span><span class="connect">Connect</span>

        <span class="chicken">🐔</span>

    </div>

</header>



<div class="container">


    <!-- TITLE -->

    <div class="title">

        <h1>Create Your Account</h1>

        <p>
            Join FeedConnect and connect with other poultry farmers.
        </p>

    </div>



    <!-- REGISTRATION -->

    <div class="card">

        <form id="registrationForm">


            <!-- NAME -->

            <div class="row">

                <div class="form-group">

                    <label>First Name</label>

                    <input
                        type="text"
                        id="firstName"
                        placeholder="First name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Last Name</label>

                    <input
                        type="text"
                        id="lastName"
                        placeholder="Last name"
                        required
                    >

                </div>

            </div>



            <!-- PHONE -->

            <div class="form-group">

                <label>Phone Number</label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="08012345678"
                    required
                >

            </div>



            <!-- EMAIL -->

            <div class="form-group">

                <label>Email Address</label>

                <input
                    type="email"
                    id="email"
                    placeholder="example@email.com"
                    required
                >

            </div>



            <!-- LOCATION -->

            <div class="row">

                <div class="form-group">

                    <label>State</label>

                    <select id="state" required>

                        <option value="">
                            Select State
                        </option>

                        <option>Kaduna</option>
                        <option>Kano</option>
                        <option>Abuja</option>
                        <option>Plateau</option>
                        <option>Niger</option>
                        <option>Benue</option>
                        <option>Nasarawa</option>
                        <option>Oyo</option>
                        <option>Lagos</option>
                        <option>Kwara</option>
                        <option>Other</option>

                    </select>

                </div>


                <div class="form-group">

                    <label>City</label>

                    <input
                        type="text"
                        id="city"
                        placeholder="Your city"
                        required
                    >

                </div>

            </div>



            <!-- FARM TYPE -->

            <div class="form-group">

                <label>What do you do?</label>

                <select id="role" required>

                    <option value="">
                        Select your role
                    </option>

                    <option>
                        Poultry Farmer
                    </option>

                    <option>
                        Feed Seller
                    </option>

                    <option>
                        Feed Company
                    </option>

                    <option>
                        Poultry Business
                    </option>

                </select>

            </div>



            <!-- FARM SIZE -->

            <div class="form-group">

                <label>Number of Birds</label>

                <select id="birds">

                    <option value="">
                        Select number
                    </option>

                    <option>1 - 100</option>

                    <option>101 - 500</option>

                    <option>501 - 1,000</option>

                    <option>1,001 - 5,000</option>

                    <option>Above 5,000</option>

                </select>

            </div>



            <!-- PASSWORD -->

            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create password"
                    minlength="6"
                    required
                >

            </div>



            <!-- CONFIRM PASSWORD -->

            <div class="form-group">

                <label>Confirm Password</label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm password"
                    required
                >

            </div>



            <!-- TERMS -->

            <div class="checkbox">

                <input
                    type="checkbox"
                    id="terms"
                    required
                >

                <label for="terms">
                    I agree to the FeedConnect terms and conditions.
                </label>

            </div>



            <!-- BUTTON -->

            <button
                type="submit"
                class="register-btn"
            >
                CREATE ACCOUNT
            </button>


        </form>



        <!-- SUCCESS -->

        <div
            class="success"
            id="success"
        ></div>


    </div>



    <!-- LOGIN -->

    <div class="login">

        Already have an account?

        <a href="#">
            Login
        </a>

    </div>


</div>



<script>

document
.getElementById("registrationForm")
.addEventListener("submit", function(event){

    event.preventDefault();


    let firstName =
        document.getElementById("firstName").value;

    let lastName =
        document.getElementById("lastName").value;

    let password =
        document.getElementById("password").value;

    let confirmPassword =
        document.getElementById("confirmPassword").value;


    /* CHECK PASSWORD */

    if(password !== confirmPassword){

        alert("The passwords do not match.");

        return;

    }


    /* SUCCESS */

    let success =
        document.getElementById("success");

    success.style.display = "block";


    success.innerHTML =

        "<strong>Registration Successful!</strong><br><br>" +

        "Welcome to FeedConnect, " +
        firstName + " " + lastName + ".<br><br>" +

        "Your account has been created in this prototype.";

});

</script>


</body>
</html>
